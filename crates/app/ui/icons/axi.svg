<svg xmlns="http://www.w3.org/2000/svg" width="216" height="216" viewBox="20 28 216 216">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2470"/>
      <stop offset="0.55" stop-color="#221a4a"/>
      <stop offset="1" stop-color="#121331"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.56" r="0.5">
      <stop offset="0" stop-color="#ff7aa8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff7aa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd3e3"/>
      <stop offset="1" stop-color="#ff98bf"/>
    </linearGradient>
    <linearGradient id="gill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4f8f"/>
      <stop offset="1" stop-color="#ff86b3"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(128 136) scale(0.9) translate(-128 -130)">
  <!-- Gills: three fronds per side, behind the head -->
  <g fill="url(#gill)">
    <g transform="translate(70 108)">
      <path d="M0 -5 L-50 -11 A11.5 11.5 0 0 0 -50 12 L0 5 Z" transform="rotate(46)"/>
      <path d="M0 -5 L-50 -11 A11.5 11.5 0 0 0 -50 12 L0 5 Z" transform="rotate(12)"/>
      <path d="M0 -5 L-50 -11 A11.5 11.5 0 0 0 -50 12 L0 5 Z" transform="rotate(-20)"/>
    </g>
    <g transform="translate(186 108) scale(-1 1)">
      <path d="M0 -5 L-50 -11 A11.5 11.5 0 0 0 -50 12 L0 5 Z" transform="rotate(46)"/>
      <path d="M0 -5 L-50 -11 A11.5 11.5 0 0 0 -50 12 L0 5 Z" transform="rotate(12)"/>
      <path d="M0 -5 L-50 -11 A11.5 11.5 0 0 0 -50 12 L0 5 Z" transform="rotate(-20)"/>
    </g>
  </g>
  <g fill="#ffb8d2">
    <g transform="translate(70 108)">
      <circle cx="-52" cy="0.5" r="5.5" transform="rotate(46)"/>
      <circle cx="-52" cy="0.5" r="5.5" transform="rotate(12)"/>
      <circle cx="-52" cy="0.5" r="5.5" transform="rotate(-20)"/>
    </g>
    <g transform="translate(186 108) scale(-1 1)">
      <circle cx="-52" cy="0.5" r="5.5" transform="rotate(46)"/>
      <circle cx="-52" cy="0.5" r="5.5" transform="rotate(12)"/>
      <circle cx="-52" cy="0.5" r="5.5" transform="rotate(-20)"/>
    </g>
  </g>

  <!-- Head -->
  <path d="M128 66c46 0 76 26 76 66 0 38-32 62-76 62s-76-24-76-62c0-40 30-66 76-66z" fill="url(#head)"/>
  <ellipse cx="128" cy="88" rx="44" ry="14" fill="#ffffff" opacity="0.35"/>

  <!-- Face -->
  <ellipse cx="86" cy="150" rx="13" ry="8" fill="#ff6fa3" opacity="0.55"/>
  <ellipse cx="170" cy="150" rx="13" ry="8" fill="#ff6fa3" opacity="0.55"/>
  <circle cx="98" cy="128" r="12" fill="#22142e"/>
  <circle cx="158" cy="128" r="12" fill="#22142e"/>
  <circle cx="102" cy="123" r="4.5" fill="#ffffff"/>
  <circle cx="162" cy="123" r="4.5" fill="#ffffff"/>
  <path d="M114 150q14 12 28 0" fill="none" stroke="#22142e" stroke-width="5.5" stroke-linecap="round"/>
  </g>
</svg>

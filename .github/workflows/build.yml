name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Built-in keys come from repository secrets; builds without them still work,
  # users just enter their own in Settings.
  AXI_MSA_CLIENT_ID: ${{ secrets.AXI_MSA_CLIENT_ID }}
  AXI_CURSEFORGE_API_KEY: ${{ secrets.AXI_CURSEFORGE_API_KEY }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p axi-app --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          $version = (cargo pkgid -p axi-app) -replace '.*[#@]', ''
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/axi-launcher.exe "dist/Axi-Launcher-$version-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*

  macos:
    name: macOS Apple Silicon
    runs-on: macos-latest # arm64 runner
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: bash packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            target/aarch64-apple-darwin/release/bundle/*.dmg
            target/aarch64-apple-darwin/release/bundle/*.app.tar.gz

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*

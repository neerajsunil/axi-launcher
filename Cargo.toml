[package]
name = "mc-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
rayon = "1.12"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.18"
zip = "9"

[build-dependencies]
slint-build = "1.18"

[features]
# `cargo dev`: hot-reloads ui/*.slint while the app is running.
dev = ["slint/live-preview"]

# Optimize dependencies once (cached) so debug builds run fast; our crate stays quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = "line-tables-only"

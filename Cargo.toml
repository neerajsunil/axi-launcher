[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.1"
edition = "2024"

[workspace.dependencies]
axi-core = { path = "crates/core" }
anyhow = "1"
base64 = "0.23"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
open = "5.4"
rayon = "1.12"
rfd = "0.15"
# Native TLS (SChannel on Windows) instead of the default rustls + aws-lc, a large C crypto library.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "system-proxy", "blocking", "form", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Software renderer only: the GPU renderers (femtovg/OpenGL, Skia/D3D) load the graphics
# driver into the process, which alone costs 90-150 MB of RAM for an app that barely animates.
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }
slint-build = "1.18"
tar = "0.4"
tempfile = "3.27"
thiserror = "2"
toml = "1.1"
winresource = "0.1"
# Minecraft jars, modpacks and JDK archives only use deflate.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Optimize dependencies once (cached) so debug builds run fast; our crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"
